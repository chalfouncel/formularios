<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M&IC Corretores de Imóveis</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0d0d0d 0%, #1a1a1a 100%);
            color: #f0f0f0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 20px;
        }

        .logo {
            width: 180px;
            height: auto;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3));
        }

        .header h1 {
            color: #d4af37;
            font-size: 1.4em;
            letter-spacing: 2px;
            font-weight: 300;
        }

        /* ===== BOTÕES PRINCIPAIS ===== */
        .main-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-profile {
            background: linear-gradient(145deg, #d4af37 0%, #b8941f 100%);
            color: #0d0d0d;
            border: none;
            padding: 25px 15px;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            text-transform: uppercase;
        }

        .btn-profile:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(212, 175, 55, 0.5);
        }

        .btn-profile .icon {
            font-size: 2em;
            display: block;
            margin-bottom: 8px;
        }

        /* ===== TELAS ===== */
        .screen {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== LISTA DE DOCUMENTOS ===== */
        .doc-info {
            background: rgba(212, 175, 55, 0.1);
            border-left: 4px solid #d4af37;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .doc-info h2 {
            color: #d4af37;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .doc-info p {
            color: #e0e0e0;
            line-height: 1.6;
            font-size: 0.95em;
        }

        .doc-info ul {
            margin-top: 10px;
            padding-left: 20px;
            color: #e0e0e0;
        }

        .doc-info ul li {
            margin: 6px 0;
            line-height: 1.5;
        }

        /* ===== BOTÕES DE AÇÃO ===== */
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            margin: 10px 0;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(145deg, #d4af37 0%, #b8941f 100%);
            color: #0d0d0d;
        }

        .btn-secondary {
            background: rgba(224, 224, 224, 0.1);
            color: #e0e0e0;
            border: 2px solid #d4af37;
        }

        .btn-danger {
            background: rgba(220, 53, 69, 0.2);
            color: #dc3545;
            border: 2px solid #dc3545;
        }

        .btn:active {
            transform: scale(0.97);
        }

        /* ===== CAPTURA DE FOTO ===== */
        .capture-area {
            background: rgba(0, 0, 0, 0.5);
            border: 2px dashed #d4af37;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }

        .capture-area video,
        .capture-area img {
            width: 100%;
            border-radius: 8px;
            margin: 10px 0;
            background: #000;
        }

        .capture-area video {
            max-height: 400px;
            object-fit: cover;
        }

        .current-doc {
            background: #d4af37;
            color: #0d0d0d;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            text-align: center;
            margin: 15px 0;
        }

        .progress {
            color: #d4af37;
            text-align: center;
            margin: 10px 0;
            font-size: 0.9em;
        }

        /* ===== RELATÓRIO FINAL ===== */
        .report-doc {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .report-doc img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
            border: 2px solid #d4af37;
        }

        .report-doc-info {
            flex: 1;
        }

        .report-doc-info h4 {
            color: #d4af37;
            margin-bottom: 5px;
            font-size: 0.95em;
        }

        .report-doc-info p {
            color: #aaa;
            font-size: 0.8em;
        }

        /* ===== BACK BUTTON ===== */
        .back-btn {
            background: transparent;
            border: none;
            color: #d4af37;
            font-size: 1em;
            cursor: pointer;
            padding: 10px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .back-btn::before {
            content: "←";
            font-size: 1.3em;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.8em;
            margin-top: 30px;
        }

        /* ===== INPUT FILE OCULTO ===== */
        #fileInput {
            display: none;
        }

        /* ===== LOADING ===== */
        .loading {
            text-align: center;
            color: #d4af37;
            padding: 20px;
        }

        .spinner {
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-top: 3px solid #d4af37;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a1a;
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .modal-content h3 {
            color: #d4af37;
            margin-bottom: 15px;
        }

        .modal-content p {
            color: #e0e0e0;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- ===== TELA PRINCIPAL ===== -->
        <div id="screen-main" class="screen active">
            <div class="header">
                <!-- ⚠️ SUBSTITUIR: URL da logomarca no GitHub -->
                <img src="https://raw.githubusercontent.com/SEU_USUARIO/SEU_REPO/main/Loga%20marca%20nova.png" 
                     alt="M&IC Corretores de Imóveis" 
                     class="logo"
                     onerror="this.style.display='none'">
                <h1>M&IC CORRETORES DE IMÓVEIS</h1>
            </div>

            <div class="main-buttons">
                <button class="btn-profile" onclick="selectProfile('proprietario')">
                    <span class="icon"></span>
                    Proprietário
                </button>
                <button class="btn-profile" onclick="selectProfile('comprador')">
                    <span class="icon">🛒</span>
                    Comprador
                </button>
                <button class="btn-profile" onclick="selectProfile('inquilino')">
                    <span class="icon"></span>
                    Inquilino
                </button>
                <button class="btn-profile" onclick="selectProfile('corretor')">
                    <span class="icon">🤝</span>
                    Corretor
                </button>
            </div>

            <div class="footer">
                © 2026 M&IC Corretores de Imóveis
            </div>
        </div>

        <!-- ===== TELA DE INFORMAÇÃO DE DOCUMENTOS ===== -->
        <div id="screen-info" class="screen">
            <button class="back-btn" onclick="goToMain()">Voltar</button>
            <div class="doc-info">
                <h2 id="info-title">Documentos Necessários</h2>
                <p id="info-text"></p>
                <ul id="info-list"></ul>
            </div>
            <button class="btn btn-primary" onclick="startCapture()">
                📷 Iniciar Captura de Documentos
            </button>
        </div>

        <!-- ===== TELA DE CAPTURA ===== -->
        <div id="screen-capture" class="screen">
            <button class="back-btn" onclick="cancelCapture()">Cancelar</button>
            
            <div class="current-doc" id="current-doc-name">Documento 1</div>
            <div class="progress" id="capture-progress">Documento 1 de 3</div>

            <div class="capture-area">
                <video id="camera" autoplay playsinline></video>
                <canvas id="canvas" style="display:none;"></canvas>
                <img id="preview" style="display:none;" alt="Preview">
            </div>

            <div id="capture-buttons">
                <button class="btn btn-primary" onclick="openCamera()"> Tirar Foto</button>
                <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">
                    📎 Anexar da Galeria
                </button>
            </div>

            <div id="preview-buttons" style="display:none;">
                <button class="btn btn-primary" onclick="confirmPhoto()">✅ Confirmar Foto</button>
                <button class="btn btn-secondary" onclick="retakePhoto()">🔄 Tirar Novamente</button>
            </div>

            <input type="file" id="fileInput" accept="image/*" capture="environment" onchange="handleFileSelect(event)">
        </div>

        <!-- ===== TELA DE RELATÓRIO FINAL ===== -->
        <div id="screen-report" class="screen">
            <button class="back-btn" onclick="goToMain()">Voltar ao Início</button>
            
            <div class="doc-info">
                <h2> Relatório Final</h2>
                <p id="report-profile-name"></p>
            </div>

            <div id="report-docs-list"></div>

            <button class="btn btn-primary" onclick="generatePDF()">
                📄 Gerar PDF com Marca D'água
            </button>
            <button class="btn btn-secondary" onclick="resetAll()">
                🔄 Novo Processo
            </button>
        </div>

    </div>

    <!-- ===== MODAL ===== -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">Atenção</h3>
            <p id="modal-text"></p>
            <button class="btn btn-primary" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        // ===== CONFIGURAÇÃO DOS PERFIS =====
        const profiles = {
            proprietario: {
                name: 'Proprietário',
                text: 'Pegue os seguintes documentos ou anexe de forma digital:',
                docs: [
                    'RG com CPF ou CNH',
                    'Comprovante de Residência',
                    'Certidão de Estado Civil (Nascimento ou Casamento)'
                ]
            },
            comprador: {
                name: 'Comprador',
                text: 'Pegue os seguintes documentos ou anexe de forma digital:',
                docs: [
                    'RG com CPF ou CNH',
                    'Comprovante de Residência',
                    'Certidão de Estado Civil (Nascimento ou Casamento)',
                    'CTPS Digital',
                    'FGTS Digital',
                    'Recibo de entrega do IR',
                    'Imposto de Renda Completo'
                ]
            },
            inquilino: {
                name: 'Inquilino',
                text: 'Pegue os seguintes documentos ou anexe de forma digital:',
                docs: [
                    'RG com CPF ou CNH',
                    'Comprovante de Residência',
                    'Recibo de entrega do IR',
                    'Imposto de Renda Completo'
                ]
            },
            corretor: {
                name: 'Corretor',
                text: 'Pegue os seguintes documentos ou anexe de forma digital:',
                docs: [
                    'RG com CPF ou CNH',
                    'CRECI'
                ]
            }
        };

        // ===== ESTADO DO APP =====
        let currentProfile = null;
        let currentDocIndex = 0;
        let capturedDocs = [];
        let cameraStream = null;

        // ===== NAVEGAÇÃO ENTRE TELAS =====
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function goToMain() {
            stopCamera();
            showScreen('screen-main');
        }

        // ===== SELEÇÃO DE PERFIL =====
        function selectProfile(profileKey) {
            currentProfile = profiles[profileKey];
            currentDocIndex = 0;
            capturedDocs = [];

            document.getElementById('info-title').textContent = 
                `Documentos - ${currentProfile.name}`;
            document.getElementById('info-text').textContent = currentProfile.text;

            const list = document.getElementById('info-list');
            list.innerHTML = '';
            currentProfile.docs.forEach(doc => {
                const li = document.createElement('li');
                li.textContent = doc;
                list.appendChild(li);
            });

            showScreen('screen-info');
        }

        // ===== INICIAR CAPTURA =====
        function startCapture() {
            showScreen('screen-capture');
            loadNextDoc();
        }

        function loadNextDoc() {
            if (currentDocIndex >= currentProfile.docs.length) {
                showReport();
                return;
            }

            const docName = currentProfile.docs[currentDocIndex];
            document.getElementById('current-doc-name').textContent = docName;
            document.getElementById('capture-progress').textContent = 
                `Documento ${currentDocIndex + 1} de ${currentProfile.docs.length}`;

            document.getElementById('preview').style.display = 'none';
            document.getElementById('camera').style.display = 'block';
            document.getElementById('capture-buttons').style.display = 'block';
            document.getElementById('preview-buttons').style.display = 'none';
        }

        // ===== CÂMERA =====
        async function openCamera() {
            try {
                const video = document.getElementById('camera');
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                });
                video.srcObject = cameraStream;
                video.style.display = 'block';
                document.getElementById('preview').style.display = 'none';
            } catch (err) {
                showModal('Erro de Câmera', 
                    'Não foi possível acessar a câmera. Use a opção "Anexar da Galeria".');
            }
        }

        function stopCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = null;
            }
        }

        function capturePhoto() {
            const video = document.getElementById('camera');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);

            const dataURL = canvas.toDataURL('image/jpeg', 0.9);
            showPreview(dataURL);
            stopCamera();
        }

        // ===== SELEÇÃO DE ARQUIVO =====
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => showPreview(e.target.result);
            reader.readAsDataURL(file);
        }

        // ===== PREVIEW E ENQUADRAMENTO =====
        function showPreview(dataURL) {
            const img = document.getElementById('preview');
            img.src = dataURL;
            img.style.display = 'block';
            document.getElementById('camera').style.display = 'none';
            document.getElementById('capture-buttons').style.display = 'none';
            document.getElementById('preview-buttons').style.display = 'block';
        }

        function retakePhoto() {
            document.getElementById('preview').style.display = 'none';
            document.getElementById('camera').style.display = 'block';
            document.getElementById('capture-buttons').style.display = 'block';
            document.getElementById('preview-buttons').style.display = 'none';
            document.getElementById('fileInput').value = '';
            openCamera();
        }

        function confirmPhoto() {
            const img = document.getElementById('preview');
            const originalSrc = img.src;

            // Enquadramento proporcional via canvas
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const image = new Image();

            image.onload = () => {
                // Redimensiona mantendo proporção (max 1200px)
                const maxSize = 1200;
                let width = image.width;
                let height = image.height;

                if (width > height && width > maxSize) {
                    height = (height * maxSize) / width;
                    width = maxSize;
                } else if (height > maxSize) {
                    width = (width * maxSize) / height;
                    height = maxSize;
                }

                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(image, 0, 0, width, height);

                const finalDataURL = canvas.toDataURL('image/jpeg', 0.9);

                capturedDocs.push({
                    name: currentProfile.docs[currentDocIndex],
                    data: finalDataURL,
                    timestamp: new Date().toLocaleString('pt-BR')
                });

                currentDocIndex++;
                document.getElementById('fileInput').value = '';
                loadNextDoc();
            };

            image.src = originalSrc;
        }

        function cancelCapture() {
            if (capturedDocs.length > 0) {
                showModal('Cancelar Captura', 
                    'Deseja realmente cancelar? Os documentos capturados serão perdidos.',
                    () => {
                        capturedDocs = [];
                        currentDocIndex = 0;
                        stopCamera();
                        showScreen('screen-info');
                    });
            } else {
                stopCamera();
                showScreen('screen-info');
            }
        }

        // ===== RELATÓRIO FINAL =====
        function showReport() {
            document.getElementById('report-profile-name').textContent = 
                `Perfil: ${currentProfile.name} — ${capturedDocs.length} documento(s) capturado(s)`;

            const list = document.getElementById('report-docs-list');
            list.innerHTML = '';

            capturedDocs.forEach((doc, idx) => {
                const div = document.createElement('div');
                div.className = 'report-doc';
                div.innerHTML = `
                    <img src="${doc.data}" alt="${doc.name}">
                    <div class="report-doc-info">
                        <h4>${idx + 1}. ${doc.name}</h4>
                        <p>Capturado em: ${doc.timestamp}</p>
                    </div>
                `;
                list.appendChild(div);
            });

            showScreen('screen-report');
        }

        // ===== GERAÇÃO DE PDF =====
        async function generatePDF() {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');

            // ⚠️ SUBSTITUIR: URL da marca d'água no GitHub
            const watermarkURL = 'https://raw.githubusercontent.com/SEU_USUARIO/SEU_REPO/main/Marca%20dagua%20nova.png';

            try {
                // Carregar marca d'água
                const watermarkImg = await loadImage(watermarkURL);
                const watermarkData = await imageToDataURL(watermarkImg);

                // Cabeçalho
                pdf.setFillColor(13, 13, 13);
                pdf.rect(0, 0, 210, 40, 'F');
                
                pdf.setTextColor(212, 175, 55);
                pdf.setFontSize(22);
                pdf.setFont(undefined, 'bold');
                pdf.text('M&IC CORRETORES DE IMÓVEIS', 105, 20, { align: 'center' });
                
                pdf.setTextColor(224, 224, 224);
                pdf.setFontSize(12);
                pdf.setFont(undefined, 'normal');
                pdf.text(`Relatório de Documentos - ${currentProfile.name}`, 105, 30, { align: 'center' });

                pdf.setTextColor(100, 100, 100);
                pdf.setFontSize(9);
                pdf.text(`Gerado em: ${new Date().toLocaleString('pt-BR')}`, 105, 36, { align: 'center' });

                let yPos = 50;

                // Adicionar cada documento
                for (let i = 0; i < capturedDocs.length; i++) {
                    const doc = capturedDocs[i];

                    // Verificar espaço na página
                    if (yPos > 240) {
                        pdf.addPage();
                        yPos = 20;
                    }

                    // Título do documento
                    pdf.setFillColor(212, 175, 55);
                    pdf.rect(10, yPos - 5, 190, 8, 'F');
                    pdf.setTextColor(13, 13, 13);
                    pdf.setFontSize(11);
                    pdf.setFont(undefined, 'bold');
                    pdf.text(`${i + 1}. ${doc.name}`, 15, yPos + 1);
                    yPos += 12;

                    // Imagem do documento
                    try {
                        const imgProps = pdf.getImageProperties(doc.data);
                        const imgWidth = 150;
                        const imgHeight = (imgProps.height * imgWidth) / imgProps.width;

                        // Limitar altura
                        const maxHeight = 120;
                        let finalHeight = imgHeight;
                        let finalWidth = imgWidth;
                        if (finalHeight > maxHeight) {
                            finalWidth = (imgWidth * maxHeight) / imgHeight;
                            finalHeight = maxHeight;
                        }

                        const xPos = (210 - finalWidth) / 2;
                        pdf.addImage(doc.data, 'JPEG', xPos, yPos, finalWidth, finalHeight);
                        yPos += finalHeight + 10;
                    } catch (err) {
                        pdf.setTextColor(220, 53, 69);
                        pdf.text('[Erro ao carregar imagem]', 105, yPos, { align: 'center' });
                        yPos += 15;
                    }
                }

                // Adicionar marca d'água em todas as páginas
                const totalPages = pdf.internal.getNumberOfPages();
                for (let i = 1; i <= totalPages; i++) {
                    pdf.setPage(i);
                    pdf.addImage(watermarkData, 'PNG', 10, 270, 190, 20, undefined, 'FAST', 0.15);
                }

                // Salvar
                const fileName = `M&IC_${currentProfile.name}_${Date.now()}.pdf`;
                pdf.save(fileName);

                showModal('PDF Gerado!', 
                    `O arquivo "${fileName}" foi baixado com sucesso.`);

            } catch (err) {
                console.error(err);
                showModal('Erro ao gerar PDF', 
                    'Verifique se a URL da marca d\'água está correta e tente novamente.');
            }
        }

        // ===== HELPERS =====
        function loadImage(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = url;
            });
        }

        function imageToDataURL(img) {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            return canvas.toDataURL('image/png');
        }

        function showModal(title, text, onConfirm) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-text').textContent = text;
            document.getElementById('modal').classList.add('active');
            
            const btn = document.querySelector('#modal .btn');
            btn.onclick = () => {
                closeModal();
                if (onConfirm) onConfirm();
            };
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function resetAll() {
            currentProfile = null;
            currentDocIndex = 0;
            capturedDocs = [];
            goToMain();
        }

        // ===== INICIALIZAÇÃO =====
        window.addEventListener('beforeunload', () => {
            stopCamera();
        });
    </script>
